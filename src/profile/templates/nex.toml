description = "wg nex: in-process LLM handler at local Ollama/Qwopus (edit URL/model per machine)"

[agent]
model = "nex:qwopus3.6:27b-mtp-q4"

[dispatcher]
model = "nex:qwopus3.6:27b-mtp-q4"
max_agents = 8

[tiers]
fast = "nex:qwopus3.6:27b-mtp-q4"
standard = "nex:qwopus3.6:27b-mtp-q4"
premium = "nex:qwopus3.6:27b-mtp-q4"

[models.default]
model = "nex:qwopus3.6:27b-mtp-q4"

[models.task_agent]
model = "nex:qwopus3.6:27b-mtp-q4"

# NOTE: agency tasks (.evaluate-*, .flip-*, .assign-*) are pinned to claude:haiku
# by design (see CLAUDE.md "Agency tasks run on claude CLI"). Override here only
# if you have a *better* local model for these short calls.

[[llm_endpoints.endpoints]]
name = "default"
provider = "oai-compat"
url = "http://127.0.0.1:11434/v1"
is_default = true
