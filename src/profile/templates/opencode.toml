description = "OpenCode CLI: Z.ai GLM workers via native provider route, Codex mini for agency meta-tasks"

# OpenCode supports Z.ai's `zai/<model>` CLI spelling. WG accepts the route as
# `opencode:zai/glm-5.2` so the executor selection stays explicit without
# spending OpenRouter tokens by default.

[agent]
model = "opencode:zai/glm-5.2"

[dispatcher]
model = "opencode:zai/glm-5.2"
max_agents = 8

[tiers]
fast = "opencode:zai/glm-5.2"
standard = "opencode:zai/glm-5.2"
premium = "opencode:zai/glm-5.2"

[models.default]
model = "opencode:zai/glm-5.2"

[models.task_agent]
model = "opencode:zai/glm-5.2"

# NOTE: agency tasks (.evaluate-*, .flip-*, .assign-*) are short one-shot LLM
# calls. OpenCode is a worker/chat external CLI and does not serve the agency
# one-shot path, so these roles use the Codex CLI directly.
[models.evaluator]
model = "codex:gpt-5.4-mini"

[models.assigner]
model = "codex:gpt-5.4-mini"

[models.flip_inference]
model = "codex:gpt-5.4-mini"

[models.flip_comparison]
model = "codex:gpt-5.4-mini"
